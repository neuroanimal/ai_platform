<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Platform chat</title>
  <link rel="stylesheet" href="/static/chat.css">
  <script src="/static/chat.js" defer></script>
</head>
<body>
  <header class="toolbar">
    <h1>AI Platform chat</h1>
    <label for="model">Model</label>
    <select id="model" aria-describedby="status"></select>
    <button type="button" id="refresh" title="Odśwież listę modeli">&#x21bb;<span class="sr-only">Odśwież modele</span></button>
    <label class="toggle"><input type="checkbox" id="use-documents"> z dokumentami</label>
    <label class="toggle"><input type="checkbox" id="use-tools"> z narzędziami</label>
    <label for="temperature">Temperatura</label>
    <input type="number" id="temperature" min="0" max="2" step="0.1" value="0.3">
    <label for="max-seconds">Limit czasu [s]</label>
    <input type="number" id="max-seconds" min="10" max="1800" step="10" value="300">
    <button type="button" id="clear">Nowa rozmowa</button>
  </header>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <main id="conversation" class="conversation" aria-live="polite" aria-label="Rozmowa"></main>
  <form id="composer" class="composer">
    <label for="question" class="sr-only">Pytanie</label>
    <textarea id="question" rows="3" placeholder="Napisz pytanie (Enter wysyła, Shift+Enter nowa linia)" required></textarea>
    <button type="submit" id="send">Wyślij</button>
    <button type="button" id="stop" disabled>Stop</button>
  </form>
</body>
</html>
