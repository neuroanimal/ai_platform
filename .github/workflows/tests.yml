# Unit and architecture tests on every push and pull request.
#
# Scope: test/basic-structural (adapters against fake servers, screening,
# benchmark logic, layer rules). Live tests (LocalAI/Ollama) and the heavy
# ML integration tests (PyTorch, TensorFlow) are not run here: they need local
# model servers or gigabytes of wheels. Optional backends (faiss, chromadb,
# qdrant, mlflow, mcp, torch, ...) are skipped by the tests when absent.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r config/requirements/ci-unit.txt
      - name: Layer boundaries
        run: python -m ai_platform.common.tool.validate_dependencies
      - name: Unit and architecture tests
        run: python -m pytest --import-mode=importlib -q -p no:cacheprovider test/basic-structural
